<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .login-container p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Entrar</h1>
    <p>Acesse a sua conta</p>

    <form action="/login" method="post">

        <div class="form-group">
            <label for="username">Email</label>
            <input
                    type="email"
                    id="username"
                    name="username"
                    placeholder="Digite o seu email"
                    required>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite a sua senha"
                    required>
        </div>

        <a href="#" class="forgot-password">
            Esqueceu a senha?
        </a>

        <button type="submit">
            Entrar
        </button>

    </form>

    <div class="register">
        Ainda não tem uma conta?
        <a href="/register">Criar conta</a>
    </div>

</div>

</body>
</html>
